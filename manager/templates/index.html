{% extends 'blank_layout.html' %}
{% load static %}

{% block content %}

<style>
    .custom-hover-card {
        transition: all 0.3s ease-in-out;
        background: linear-gradient(145deg, #ffffff, #f8f9fa);
        border: 1px solid #dee2e6;
    }
    .custom-hover-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 20px rgba(13, 110, 253, 0.15) !important;
        border-color: #0d6efd;
    }
    .quick-link-img {
        height: 55px;
        width: auto;
        object-fit: contain;
        transition: transform 0.3s ease;
    }
    .custom-hover-card:hover .quick-link-img {
        transform: scale(1.1);
    }
    .quick-link-title {
        font-size: 0.85rem;
    }
    @media (max-width: 768px) {
        .quick-link-img {
            height: 40px;
        }
        .quick-link-title {
            font-size: 0.7rem !important;
        }
    }
</style>

<section class="container-fluid">
    <div class="row">
        <div class="col-12 col-md-6">
            <section class="container-fluid">
                <div class="row">
                    <row class="d-flex justify-content-center">
                        <img src="{% static 'images/gallery-img8.jpg' %}" alt="" class="col-12 col-md-12 rounded-5"
                            style="padding-top: 50px ; height: 340px; width: 370px;">
                    </row>
                </div>
            </section>

            <section>
                <div class="d-grid gap-2 container">
                    <br><br>
                    <button class="btn btn-primary" type="button">
                        <a class="text-white" style="text-decoration: none;" href="{% url 'all_products' %}">VIEW ALL PRODUCTS</a>
                    </button>
                </div>
            </section>
        </div>

        <div class="col-12 col-md-6">
            <section class="container-fluid">
                <div class="row">
                    <div class="col-6 col-md-3 pt-4">
                        <div class="card rounded-4 border bg-dark border-primary border-3 px-0">
                            <a href="{% url 'show_cupboard' %}"><img src="{% static 'images/WARDROBE2.jpg' %}"
                                    class="card-img-top" style="border-radius: 13PX;height:150px;" alt=""></a>
                            <h5 class="text-center pt-2" style="color: aliceblue;">CUPBOARD</h5>
                        </div>
                    </div>
                    <div class="col-6 col-md-3 pt-4">
                        <div class="card rounded-4 border bg-dark border-primary border-3 px-0">
                            <a href="{% url 'show_table' %}"><img src="{% static 'images/TABLE.jpg' %}"
                                    class="card-img-top" style="border-radius: 13PX;height:150px;" alt=""></a>
                            <h5 class="text-center pt-2" style="color: aliceblue;">TABLE</h5>
                        </div>
                    </div>
                    <div class="col-6 col-md-3 pt-4">
                        <div class="card rounded-4 border bg-dark border-primary border-3 px-0">
                            <a href="{% url 'show_tv_stand' %}"><img src="{% static 'images/tv.png' %}"
                                    class="card-img-top" style="border-radius: 13PX;height:150px;" alt=""></a>
                            <h5 class="text-center pt-2" style="color: aliceblue;">TV STAND</h5>
                        </div>
                    </div>
                    <div class="col-6 col-md-3 pt-4">
                        <div class="card rounded-4 border bg-dark border-primary border-3 px-0">
                            <a href="{% url 'show_sofa' %}"><img src="{% static 'images/page4-img6.jpg' %}"
                                    class="card-img-top" style="border-radius: 13PX;height:150px;" alt=""></a>
                            <h5 class="text-center pt-2" style="color: aliceblue;">SOFA</h5>
                        </div>
                    </div>
                    <div class="col-6 col-md-3 pt-4">
                        <div class="card rounded-4 border bg-dark border-primary border-3 px-0">
                            <a href="{% url 'bedroom_set' %}"><img src="{% static 'images/BEDROOM SET.jpeg' %}"
                                    class="card-img-top" style="border-radius: 13PX;height:150px;" alt=""></a>
                            <h5 class="text-center pt-2" style="color: aliceblue;">BEDROOM SET</h5>
                        </div>
                    </div>
                    <div class="col-6 col-md-3 pt-4">
                        <div class="card rounded-4 border bg-dark border-primary border-3 px-0">
                            <a href="{% url 'pooja_stand' %}"><img src="{% static 'images/POOJASTAND.jpeg' %}"
                                    class="card-img-top" style="border-radius: 13PX;height:150px;" alt=""></a>
                            <h5 class="text-center pt-2" style="color: aliceblue;">POOJA STAND</h5>
                        </div>
                    </div>
                    <div class="col-6 col-md-3 pt-4">
                        <div class="card rounded-4 border bg-dark border-primary border-3 px-0">
                            <a href="{% url 'others' %}"><img src="https://i5.walmartimages.com/asr/50f8a93c-978f-478a-8175-0b0878ad64b2.c1b2cb65b52150dd2406e1b04f298404.jpeg"
                                    class="card-img-top" style="border-radius: 13PX;height:150px;" alt=""></a>
                            <h5 class="text-center pt-2" style="color: aliceblue;">OTHERS</h5>
                        </div>
                    </div>
                    <div class="col-6 col-md-3 pt-4">
                        <div class="card rounded-4 border bg-dark border-primary border-3 px-0">
                            <a href="{% url 'order' %}"><img src="{% static 'images/order.jpg' %}" class="card-img-top"
                                    style="border-radius: 13PX;height:150px;" alt=""></a>
                            <h5 class="text-center pt-2" style="color: aliceblue;">ORDERS</h5>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</section>

<section class="container-fluid mt-5 mb-5 px-3">
    <div class="row justify-content-center g-3">
        
        <div class="col-4 col-md-2">
            <a href="{% url 'sales_bill' %}" class="text-decoration-none">
                <div class="card h-100 shadow-sm custom-hover-card rounded-4 p-2 text-center">
                    <div class="card-body p-1 d-flex flex-column align-items-center justify-content-center">
                        <img src="{% static 'images/H1.png' %}" class="quick-link-img mb-2" alt="SALES BILL">
                        <h6 class="fw-bold text-dark mb-0 quick-link-title text-uppercase">SALES BILL</h6>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-4 col-md-2">
            <a href="#" class="text-decoration-none">
                <div class="card h-100 shadow-sm custom-hover-card rounded-4 p-2 text-center">
                    <div class="card-body p-1 d-flex flex-column align-items-center justify-content-center">
                        <img src="{% static 'images/H2.png' %}" class="quick-link-img mb-2" alt="STOCK">
                        <h6 class="fw-bold text-dark mb-0 quick-link-title text-uppercase">STOCK</h6>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-4 col-md-2">
            <a href="{% url 'master_data' %}" class="text-decoration-none">
                <div class="card h-100 shadow-sm custom-hover-card rounded-4 p-2 text-center">
                    <div class="card-body p-1 d-flex flex-column align-items-center justify-content-center">
                        <img src="{% static 'images/H3.png' %}" class="quick-link-img mb-2" alt="SOFA MASTER">
                        <h6 class="fw-bold text-dark mb-0 quick-link-title text-uppercase">SOFA MASTER</h6>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-4 col-md-2">
            <a href="{% url 'product_master' %}" class="text-decoration-none">
                <div class="card h-100 shadow-sm custom-hover-card rounded-4 p-2 text-center">
                    <div class="card-body p-1 d-flex flex-column align-items-center justify-content-center">
                        <img src="{% static 'images/H4.png' %}" class="quick-link-img mb-2" alt="PB_MASTER">
                        <h6 class="fw-bold text-dark mb-0 quick-link-title text-uppercase">PB_MASTER</h6>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-4 col-md-2">
            <a href="{% url 'image_categories' %}" class="text-decoration-none">
                <div class="card h-100 shadow-sm custom-hover-card rounded-4 p-2 text-center">
                    <div class="card-body p-1 d-flex flex-column align-items-center justify-content-center">
                        <img src="{% static 'images/H5.png' %}" class="quick-link-img mb-2" alt="IMAGES">
                        <h6 class="fw-bold text-dark mb-0 quick-link-title text-uppercase">IMAGES</h6>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-4 col-md-2">
            <a href="{% url 'others_menu' %}" class="text-decoration-none">
                <div class="card h-100 shadow-sm custom-hover-card rounded-4 p-2 text-center">
                    <div class="card-body p-1 d-flex flex-column align-items-center justify-content-center">
                        <img src="{% static 'images/H6.png' %}" class="quick-link-img mb-2" alt="OTHERS">
                        <h6 class="fw-bold text-dark mb-0 quick-link-title text-uppercase">OTHERS</h6>
                    </div>
                </div>
            </a>
        </div>

    </div>
</section>
<br>

{% endblock %}

{% extends 'blank_layout.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4 mt-5">
                <div class="card-header bg-dark text-white text-center rounded-top-4 py-3">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-lock-fill me-2"></i>Staff Login</h4>
                </div>
                <div class="card-body p-4 bg-light rounded-bottom-4">
                    {% if form.errors %}
                        <div class="alert alert-danger small fw-bold">Invalid username or password.</div>
                    {% endif %}
                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">Username</label>
                            <input type="text" name="username" class="form-control border-secondary" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold text-secondary">Password</label>
                            <input type="password" name="password" class="form-control border-secondary" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-pill shadow">LOGIN</button>
                        <input type="hidden" name="next" value="{{ next|default:'/' }}">
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
